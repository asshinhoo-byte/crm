<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solo CRM - 구글 시트 공유 DB 연동</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --subtext: #64748b;
      --border: #e2e8f0;
      --call-color: #16a34a;
      --sms-color: #0284c7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 12px;
      max-width: 500px;
      margin: 0 auto;
    }
    .header {
      background: linear-gradient(135deg, #2563eb, #1e40af);
      color: white;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 12px;
    }
    .header h1 { font-size: 1.25rem; font-weight: 700; }
    .header p { font-size: 0.8rem; opacity: 0.9; margin-top: 4px; }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .card-title { font-size: 1rem; font-weight: 700; margin-bottom: 12px; color: #1e293b; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--subtext); margin-bottom: 4px; }
    input, select, textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    .btn {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-call { background-color: var(--call-color); }
    .btn-sms { background-color: var(--sms-color); }
    .btn-group { display: flex; gap: 8px; }
    .btn-group .btn { flex: 1; }
    .tab-header { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 12px; }
    .tab-btn {
      flex: 1; padding: 10px; background: none; border: none; font-weight: 600;
      color: var(--subtext); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px;
    }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
    .history-item { background: #f8fafc; border-left: 4px solid var(--primary); border-radius: 6px; padding: 10px; margin-top: 8px; }
    .history-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--subtext); margin-bottom: 4px; }
    .loading { display: none; text-align: center; color: var(--primary); font-size: 0.85rem; font-weight: 600; padding: 8px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Solo CRM (공유 DB)</h1>
    <p>구글 스프레드시트 실시간 동기화</p>
  </div>

  <div class="card">
    <div class="card-title">고객 전화번호 검색</div>
    <div class="form-group">
      <input type="tel" id="searchPhone" placeholder="전화번호 입력 (예: 01012345678)" onkeyup="if(event.key==='Enter') searchCustomer()">
    </div>
    <button class="btn" onclick="searchCustomer()">검색하기</button>
  </div>

  <div id="loading" class="loading">☁️ 구글 시트에서 데이터를 불러오는 중...</div>

  <div id="customerSection" style="display:none;">
    <div class="card">
      <div class="card-title">고객 프로필</div>
      <div class="btn-group" style="margin-bottom: 12px;">
        <button class="btn btn-call" onclick="makeCall()">📞 전화걸기</button>
        <button class="btn btn-sms" onclick="sendSMS()">💬 문자보내기</button>
      </div>
      <div class="form-group">
        <label>전화번호</label>
        <input type="tel" id="custPhone" readonly style="background:#f1f5f9;">
      </div>
      <div class="form-group">
        <label>고객명</label>
        <input type="text" id="custName" placeholder="이름 입력">
      </div>
      <div class="form-group">
        <label>메모</label>
        <input type="text" id="custMemo" placeholder="특이사항 입력">
      </div>
      <button class="btn" style="background-color:#64748b;" onclick="saveCustomerProfile()">프로필 저장 (공유 DB)</button>
    </div>

    <div class="card">
      <div class="tab-header">
        <button class="tab-btn active" onclick="switchTab('consult')">상담기록</button>
        <button class="tab-btn" onclick="switchTab('call')">통화이력</button>
        <button class="tab-btn" onclick="switchTab('sms')">문자이력</button>
      </div>

      <div id="consultTab" class="tab-content">
        <div class="form-group">
          <select id="consultType">
            <option value="일반문의">일반문의</option>
            <option value="신규계약">신규계약</option>
            <option value="A/S접수">A/S접수</option>
          </select>
        </div>
        <div class="form-group">
          <textarea id="consultContent" rows="3" placeholder="상담 내역 작성"></textarea>
        </div>
        <button class="btn" onclick="addHistory('consult')">상담 기록 추가</button>
        <div id="consultList"></div>
      </div>

      <div id="callTab" class="tab-content" style="display:none;">
        <div class="form-group">
          <select id="callType">
            <option value="수신">📥 수신 (걸려온 전화)</option>
            <option value="발신">📤 발신 (걸은 전화)</option>
            <option value="부재중">⚠️ 부재중</option>
          </select>
        </div>
        <div class="form-group">
          <input type="text" id="callMemo" placeholder="통화 요약 내용">
        </div>
        <button class="btn btn-call" onclick="addHistory('call')">통화 기록 추가</button>
        <div id="callList"></div>
      </div>

      <div id="smsTab" class="tab-content" style="display:none;">
        <div class="form-group">
          <select id="smsType">
            <option value="수신">📥 수신 (받은 문자)</option>
            <option value="발신">📤 발신 (보낸 문자)</option>
          </select>
        </div>
        <div class="form-group">
          <textarea id="smsContent" rows="2" placeholder="문자 내용 입력"></textarea>
        </div>
        <button class="btn btn-sms" onclick="addHistory('sms')">문자 기록 추가</button>
        <div id="smsList"></div>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ 1단계에서 얻은 구글 Apps Script 웹 앱 배포 URL을 아래 큰따옴표 안에 넣어주세요.
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbz110pZeIebOcZipaUE5yLJl_jQNzG5KqTizFY1oW3-LDDsmlQp6v_6EfvfA81Rf4jP2A/exec";

    function showLoading(show) {
      document.getElementById('loading').style.display = show ? 'block' : 'none';
    }

    async function searchCustomer() {
      const phone = document.getElementById('searchPhone').value.replace(/[^0-9]/g, '');
      if(!phone) return alert('전화번호를 입력하세요.');
      if(GAS_API_URL === "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE") {
        return alert('HTML 코드 내 GAS_API_URL에 구글 앱스 스크립트 배포 주소를 설정해주세요.');
      }

      showLoading(true);
      document.getElementById('customerSection').style.display = 'none';

      try {
        const response = await fetch(`${GAS_API_URL}?action=get&phone=${phone}`);
        const data = await response.json();

        document.getElementById('customerSection').style.display = 'block';
        document.getElementById('custPhone').value = phone;
        document.getElementById('custName').value = data.customer.name || '';
        document.getElementById('custMemo').value = data.customer.memo || '';

        renderHistories(data.histories);
      } catch (err) {
        alert('데이터를 불러오지 못했습니다: ' + err);
      } finally {
        showLoading(false);
      }
    }

    async function saveCustomerProfile() {
      const phone = document.getElementById('custPhone').value;
      if(!phone) return;

      showLoading(true);
      const payload = {
        action: 'saveProfile',
        phone: phone,
        name: document.getElementById('custName').value,
        memo: document.getElementById('custMemo').value
      };

      try {
        await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        alert('구글 시트에 프로필이 저장되었습니다.');
      } catch (err) {
        alert('저장 실패: ' + err);
      } finally {
        showLoading(false);
      }
    }

    async function addHistory(category) {
      const phone = document.getElementById('custPhone').value;
      if(!phone) return;

      let content = '', subType = '';
      if(category === 'consult') {
        subType = document.getElementById('consultType').value;
        content = document.getElementById('consultContent').value;
      } else if(category === 'call') {
        subType = document.getElementById('callType').value;
        content = document.getElementById('callMemo').value;
      } else if(category === 'sms') {
        subType = document.getElementById('smsType').value;
        content = document.getElementById('smsContent').value;
      }

      if(!content) return alert('내용을 입력하세요.');

      showLoading(true);
      const now = new Date();
      const payload = {
        action: 'addHistory',
        phone: phone,
        category: category,
        subType: subType,
        content: content,
        date: now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
      };

      try {
        await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        if(category === 'consult') document.getElementById('consultContent').value = '';
        if(category === 'call') document.getElementById('callMemo').value = '';
        if(category === 'sms') document.getElementById('smsContent').value = '';

        searchCustomer();
      } catch (err) {
        alert('기록 추가 실패: ' + err);
      } finally {
        showLoading(false);
      }
    }

    function renderHistories(histories) {
      const consultList = document.getElementById('consultList');
      const callList = document.getElementById('callList');
      const smsList = document.getElementById('smsList');

      consultList.innerHTML = '';
      callList.innerHTML = '';
      smsList.innerHTML = '';

      histories.forEach(h => {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML = `
          <div class="history-header">
            <span><strong>[${h.subType}]</strong> ${h.date}</span>
          </div>
          <div>${h.content}</div>
        `;

        if(h.category === 'consult') consultList.appendChild(item);
        else if(h.category === 'call') callList.appendChild(item.cloneNode(true));
        else if(h.category === 'sms') smsList.appendChild(item.cloneNode(true));
      });
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.style.display = 'none');
      
      if(tabName === 'consult') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('consultTab').style.display = 'block';
      } else if(tabName === 'call') {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('callTab').style.display = 'block';
      } else if(tabName === 'sms') {
        document.querySelectorAll('.tab-btn')[2].classList.add('active');
        document.getElementById('smsTab').style.display = 'block';
      }
    }

    function makeCall() {
      const phone = document.getElementById('custPhone').value;
      if(phone) window.location.href = `tel:${phone}`;
    }

    function sendSMS() {
      const phone = document.getElementById('custPhone').value;
      if(phone) window.location.href = `sms:${phone}`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const phone = params.get('phone');
      if(phone) {
        document.getElementById('searchPhone').value = phone;
        searchCustomer();
      }
    });
  </script>
</body>
</html>
